name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: read

# GitHub retains one running and one pending run; local hooks prevent normal
# pushes from filling that queue before the previous release is verified.
concurrency:
  group: glimpse-release-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      build_number: ${{ steps.check.outputs.build_number }}
      previous_tag: ${{ steps.check.outputs.previous_tag }}
      should_release: ${{ steps.check.outputs.should_release }}
      previous_record_artifact: ${{ steps.check.outputs.previous_record_artifact }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify previous release, version increase, and completed reviews
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            python3 tools/scripts/release-control.py gate \
              --expected-sha "$BEFORE_SHA" --ignore-run-id "$GITHUB_RUN_ID" \
              --output previous-release.json
          else
            echo "Use rerun on a failed release; dispatch requires a verified current main."
            python3 tools/scripts/release-control.py gate \
              --ignore-run-id "$GITHUB_RUN_ID" --output previous-release.json
          fi
          python3 tools/scripts/release-control.py version > current-version.json
          BASE_SHA=$(python3 -c 'import json; print(json.load(open("previous-release.json"))["source_sha"])')
          CHANGE_KIND=$(python3 tools/scripts/release-control.py classify --base-sha "$BASE_SHA")
          export CHANGE_KIND
          python3 - <<'PY'
          import json, os, subprocess
          current = json.load(open("current-version.json"))
          previous = json.load(open("previous-release.json"))
          internal = os.environ["CHANGE_KIND"] == "internal" and all(
              current[key] == previous[key] for key in ("version", "build"))
          if not internal:
              subprocess.run(["python3", "tools/scripts/release-control.py", "readiness"], check=True)
              if int(current["build"]) <= int(previous["build"]):
                  raise SystemExit("App releases require a higher Sparkle build number")
              if tuple(map(int, current["version"].split("."))) <= tuple(map(int, previous["version"].split("."))):
                  raise SystemExit("App releases require a higher marketing version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f'version={current["version"]}\nbuild_number={current["build"]}\nprevious_tag={previous["tag"]}\n')
              output.write(f'should_release={str(not internal).lower()}\n')
              output.write(f'previous_record_artifact=previous-release-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.check.outputs.previous_record_artifact }}
          path: previous-release.json
          retention-days: 30

  quality:
    uses: ./.github/workflows/quality.yml

  # ─── Build, Sign, Notarize, Create GitHub Release ───

  build:
    needs: [inspect, quality]
    if: needs.inspect.outputs.should_release == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    outputs:
      release_verified: ${{ steps.publish.outputs.release_verified }}
    env:
      VERSION: ${{ needs.inspect.outputs.version }}
      BUILD_NUMBER: ${{ needs.inspect.outputs.build_number }}
      DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download
      GLIMPSE_BUILD_ROOT: ${{ vars.GLIMPSE_BUILD_ROOT }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.inspect.outputs.previous_record_artifact }}
          path: ${{ runner.temp }}/previous-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare isolated release paths and signed source identity
        run: |
          STORAGE_ROOT="${GLIMPSE_BUILD_ROOT:-$RUNNER_TEMP}"
          mkdir -p "$STORAGE_ROOT"
          RELEASE_DIR=$(mktemp -d "$STORAGE_ROOT/release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.XXXXXX")
          mkdir -p "$RELEASE_DIR/tmp"
          echo "TMPDIR=$RELEASE_DIR/tmp" >> "$GITHUB_ENV"
          # This checkout's ignored build path contains only this job's outputs.
          rm -rf build
          ln -s "$RELEASE_DIR" build
          cp "$RUNNER_TEMP/previous-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/previous-release.json" build/
          echo "DERIVED_DATA=$RELEASE_DIR/DerivedData" >> "$GITHUB_ENV"
          mkdir -p build/release
          cp Glimpse/Info.plist "$RUNNER_TEMP/glimpse-release-info-$GITHUB_RUN_ID.plist"
          /usr/libexec/PlistBuddy -c "Add :GlimpseSourceSHA string $GITHUB_SHA" \
            "$RUNNER_TEMP/glimpse-release-info-$GITHUB_RUN_ID.plist"

      - name: Install signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          umask 077
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/glimpse-signing.keychain-db
          KEYCHAIN_PWD=$(openssl rand -hex 16)

          # Save original keychain search list for restore in cleanup
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"

          # Download Apple CA certificates (required for complete trust chain)
          curl --fail --silent --show-error --location "https://www.apple.com/appleca/AppleIncRootCertificate.cer" -o "$RUNNER_TEMP/AppleRoot.cer"
          curl --fail --silent --show-error --location "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          curl --fail --silent --show-error --location "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Import Apple CA chain for trust verification
          security import "$RUNNER_TEMP/AppleRoot.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          # Import developer certificates
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          # Include login keychain + System Roots for Apple CA trust chain
          security list-keychains -d user -s "$KEYCHAIN_PATH" ~/Library/Keychains/login.keychain-db /Library/Keychains/System.keychain /System/Library/Keychains/SystemRootCertificates.keychain

          SIGNING_IDENTITY=$(python3 tools/scripts/select-signing-identity.py \
            --keychain "$KEYCHAIN_PATH" --team-id "$TEAM_ID")
          printf 'SIGNING_IDENTITY=%s\nSIGNING_KEYCHAIN=%s\n' \
            "$SIGNING_IDENTITY" "$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          rm -f "$CERTIFICATE_PATH" "$RUNNER_TEMP/AppleRoot.cer" "$RUNNER_TEMP/AppleWWDRCAG3.cer" "$RUNNER_TEMP/DeveloperIDG2CA.cer"

      - name: Validate signing identity
        run: |
          SMOKE_DIR=$(mktemp -d "$RUNNER_TEMP/glimpse-signing-smoke.XXXXXX")
          trap 'rm -rf -- "$SMOKE_DIR"' EXIT
          SIGNING_PROBE="$SMOKE_DIR/signing-probe"
          cp /usr/bin/true "$SIGNING_PROBE"
          codesign --force --sign "$SIGNING_IDENTITY" --keychain "$SIGNING_KEYCHAIN" \
            --options runtime --timestamp=none "$SIGNING_PROBE"
          codesign --verify --strict --verbose=2 "$SIGNING_PROBE"

      - name: Resolve SPM dependencies
        run: |
          python3 tools/scripts/check-dependency-pins.py
          xcodebuild -project Glimpse.xcodeproj -scheme Glimpse \
            -derivedDataPath "$DERIVED_DATA" \
            -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -skipMacroValidation

      - name: Install tools
        run: command -v create-dmg || brew install create-dmg

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild -project Glimpse.xcodeproj -scheme Glimpse -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath ./build/archive.xcarchive \
            -skipMacroValidation -disableAutomaticPackageResolution \
            INFOPLIST_FILE="$RUNNER_TEMP/glimpse-release-info-$GITHUB_RUN_ID.plist" \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--keychain \"$SIGNING_KEYCHAIN\"" \
            DEVELOPMENT_TEAM="$TEAM_ID" archive

      - name: Export
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          options = {"method": "developer-id", "signingStyle": "manual",
                     "signingCertificate": os.environ["SIGNING_IDENTITY"],
                     "teamID": os.environ["TEAM_ID"]}
          with open("./build/ExportOptions.plist", "wb") as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive \
            -archivePath ./build/archive.xcarchive \
            -exportPath ./build/export \
            -exportOptionsPlist ./build/ExportOptions.plist
          test -d "./build/export/Glimpse.app" || { echo "❌ Export failed"; exit 1; }

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Verify export signing is correct
          codesign -dvv ./build/export/Glimpse.app 2>&1 | grep -E "Authority|Runtime"

          # Notarize
          ditto -c -k --keepParent ./build/export/Glimpse.app ./build/Glimpse-notarize.zip
          xcrun notarytool submit ./build/Glimpse-notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$TEAM_ID" --wait
          for i in 1 2 3; do
            if xcrun stapler staple ./build/export/Glimpse.app; then break; fi
            echo "Staple attempt $i failed, waiting 15s..."
            sleep 15
          done
          xcrun stapler validate ./build/export/Glimpse.app || { echo "❌ App staple failed after 3 attempts"; exit 1; }
          rm -f ./build/Glimpse-notarize.zip

      - name: Create and notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          mkdir -p ./build/dmg_staging
          cp -R ./build/export/Glimpse.app ./build/dmg_staging/

          # Skip cosmetic Finder automation in CI; the Applications link is still created.
          DMG_ARGS=(
            --skip-jenkins
            --volname "Glimpse"
            --window-pos 200 120 --window-size 600 400
            --icon-size 100 --icon "Glimpse.app" 150 190
            --app-drop-link 450 190 --hide-extension "Glimpse.app"
            --no-internet-enable
          )

          # Add optional resources if they exist
          if [ -f "./tools/resources/AppIcon.icns" ]; then
            DMG_ARGS+=(--volicon "./tools/resources/AppIcon.icns")
          fi

          create-dmg "${DMG_ARGS[@]}" "./build/Glimpse-${VERSION}.dmg" "./build/dmg_staging"

          # Set custom file icon on the DMG
          if [ -f "./tools/resources/AppIcon.icns" ]; then
            ICON_RSRC=$(mktemp)
            sips -i ./tools/resources/AppIcon.icns >/dev/null 2>&1
            DeRez -only icns ./tools/resources/AppIcon.icns > "$ICON_RSRC" 2>/dev/null
            Rez -append "$ICON_RSRC" -o "./build/Glimpse-${VERSION}.dmg" 2>/dev/null
            SetFile -a C "./build/Glimpse-${VERSION}.dmg" 2>/dev/null
            rm -f "$ICON_RSRC"
          fi

          # Gatekeeper assesses the disk image's own signature before its app.
          codesign --force --sign "$SIGNING_IDENTITY" --keychain "$SIGNING_KEYCHAIN" \
            --timestamp "./build/Glimpse-${VERSION}.dmg"
          codesign --verify --strict --verbose=2 "./build/Glimpse-${VERSION}.dmg"
          xcrun notarytool submit "./build/Glimpse-${VERSION}.dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$TEAM_ID" --wait
          for i in 1 2 3; do
            if xcrun stapler staple "./build/Glimpse-${VERSION}.dmg"; then break; fi
            echo "Staple attempt $i failed, waiting 15s..."; sleep 15
          done
          xcrun stapler validate "./build/Glimpse-${VERSION}.dmg" || { echo "❌ DMG staple failed after 3 attempts"; exit 1; }

      - name: Sign with Sparkle and generate appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_BIN=$(find "$DERIVED_DATA/SourcePackages/artifacts" -path "*/sparkle/Sparkle/bin" -type d | head -1)
          test -x "$SPARKLE_BIN/sign_update"
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          chmod 600 "$KEY_FILE"
          printf '%s' "$SPARKLE_KEY" > "$KEY_FILE"
          "$SPARKLE_BIN/sign_update" "./build/Glimpse-${VERSION}.dmg" --ed-key-file "$KEY_FILE"
          mkdir -p ./build/appcast_source
          cp "./build/Glimpse-${VERSION}.dmg" ./build/appcast_source/
          "$SPARKLE_BIN/generate_appcast" --ed-key-file "$KEY_FILE" \
            --download-url-prefix "$DOWNLOAD_URL_PREFIX/v${VERSION}/" \
            ./build/appcast_source
          rm -f "$KEY_FILE"
          cp "./build/Glimpse-${VERSION}.dmg" build/release/
          cp ./build/appcast_source/appcast.xml build/release/

      - name: Verify signed local artifact
        run: tools/scripts/verify-dmg.sh build/release "$VERSION" "$BUILD_NUMBER" "$GITHUB_SHA"

      - name: Publish verified draft and check public downloads
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/scripts/publish-release.sh build/release build/previous-release.json

      - name: Clean up
        if: always()
        run: |
          trap 'rm -f -- "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/AppleRoot.cer" "$RUNNER_TEMP/AppleWWDRCAG3.cer" "$RUNNER_TEMP/DeveloperIDG2CA.cer"' EXIT
          security delete-keychain "$RUNNER_TEMP/glimpse-signing.keychain-db" 2>/dev/null || true
          # Restore original keychain search list
          if [ -f "$RUNNER_TEMP/original-keychains.txt" ]; then
            python3 - <<'PY'
          import os, pathlib, shlex, subprocess
          original = pathlib.Path(os.environ["RUNNER_TEMP"]) / "original-keychains.txt"
          subprocess.run(["security", "list-keychains", "-d", "user", "-s",
                          *shlex.split(original.read_text())], check=True)
          original.unlink()
          PY
          fi
          rm -f "$RUNNER_TEMP/glimpse-release-info-$GITHUB_RUN_ID.plist"
          if [[ -n "${DERIVED_DATA:-}" ]]; then rm -rf "$DERIVED_DATA"; fi

      - name: Withdraw this release if later job steps fail
        if: failure() && steps.publish.outputs.release_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.publish.outputs.release_id }}
          PREVIOUS_TAG: ${{ needs.inspect.outputs.previous_tag }}
        run: python3 tools/scripts/release-control.py withdraw --release-id "$RELEASE_ID" --previous-tag "$PREVIOUS_TAG"

  release-verified:
    needs: [inspect, quality, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.inspect.result == 'success'
        with:
          name: ${{ needs.inspect.outputs.previous_record_artifact }}
      - name: Require complete quality, artifact, and public-health verification
        env:
          INSPECT_RESULT: ${{ needs.inspect.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_VERIFIED: ${{ needs.build.outputs.release_verified }}
          SHOULD_RELEASE: ${{ needs.inspect.outputs.should_release }}
          VERSION: ${{ needs.inspect.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$INSPECT_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [[ "$SHOULD_RELEASE" == true ]]; then
            test "$BUILD_RESULT" = success
            test "$RELEASE_VERIFIED" = true
            python3 tools/scripts/release-control.py verify --tag "v$VERSION" \
              --directory verified-public --public --metadata-only
          else
            test "$BUILD_RESULT" = skipped
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os, pathlib
          previous = json.load(open("previous-release.json"))
          published = os.environ["SHOULD_RELEASE"] == "true"
          record = {
              "source_sha": os.environ["GITHUB_SHA"],
              "healthy_source_sha": os.environ["GITHUB_SHA"] if published else previous["source_sha"],
              "healthy_tag": "v" + os.environ["VERSION"] if published else previous["tag"],
              "publication": "published" if published else "not_required",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          pathlib.Path("source-verification.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-verification.json
          retention-days: 90

  metrics:
    needs: [inspect, quality, build, release-verified]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record release outcome and duration
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/scripts/release-metrics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-metrics.json
          retention-days: 90
